<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOO</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      min-height: 100vh;
      padding: 25px;
    }

    h1 {
      font-size: 32px;
    }

    .app {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      background: #222;
    }

    .button {
      display: block;
      background: #078f63;
      color: white;
      text-align: center;
      padding: 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      margin: 25px 0;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin: 25px 0;
    }

    .screenshots {
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }

    .shot {
      min-width: 180px;
      height: 280px;
      background: #ddd;
      border-radius: 12px;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="app">
    <div class="logo"></div>

    <div>
      <h1>BOO</h1>
      <p>Boopalanceo</p>
    </div>
  </div>

  <div class="stats">
    <div>⭐ 4.8<br>Rating</div>
    <div>100K+<br>Downloads</div>
    <div>18+<br>Age</div>
  </div>

  <a class="button" href="#">
    INSTALL
  </a>

  <h2>About this app</h2>

  <p>
    Welcome to BOO. This is our official application website.
    Explore the features and information about our application.
  </p>

  <h2>Screenshots</h2>

  <div class="screenshots">
    <div class="shot"></div>
    <div class="shot"></div>
    <div class="shot"></div>
  </div>

</div>

</body>
</html>
